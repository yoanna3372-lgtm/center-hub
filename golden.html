const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const f=n=>n==null||n===""?"":Number(n).toLocaleString("ko-KR");
const bnum=b=>parseInt((b||"").replace(/\D/g,""))||0;
const pad=n=>String(n).padStart(2,"0");

  let h=`<div class="title"><i></i>충청GA본부 Golden rule</div><div class="date">${md(day)}</div>
<table><thead>
<tr><th rowspan="2" class="g-base">지점명</th><th rowspan="2" class="g-base">코드</th><th rowspan="2" class="g-base">매니저</th><th rowspan="2" class="g-base">직책</th>

  [...new Set(vis.map(r=>r.branch))].sort((a,b)=>bnum(a)-bnum(b)).forEach(b=>{
    const l=vis.filter(r=>r.branch===b);

      const c=checks.get(r.code)||{},on=!!c.shared;
      h+=`<tr><td class="l">충청GA-${bnum(b)}지점</td><td>${esc(r.code)}</td><td class="l"><span class="nm">${esc(r.name)}</span></td><td class="${r.grade==="AM"?"grade-am":r.grade==="GSM"?"grade-gsm":""}">${esc(r.grade)}</td>
      <td>${f(r.prev_use)}</td><td class="${r.noon_use!=null&&r.prev_use!=null&&r.noon_use<r.prev_use?"bad":"good"}">${f(r.noon_use)}</td>
      <td class="${on?"good":""}"><button class="chk ${on?"on":""}" data-code="${esc(r.code)}" title="${on?esc((c.checked_by||"")+" 체크 · 다시 누르면 취소"):"눌러서 공유 체크"}">${on?"✔ 공유":"미확인"}</button></td>
      <td class="good">${f(r.prev_contract)}</td><td class="good">${f(r.c1130)}</td>
      <td class="${r.mapping==null||r.mapping<0?"bad":"good"}">${r.mapping==null?"":f(r.mapping)}</td>
      <td><input class="nt" data-note="${esc(r.code)}" value="${esc(c.note||"")}" placeholder="비고"></td></tr>`;
    });
    h+=`<tr class="sub"><td class="l">${bnum(b)}지점 합계</td><td></td><td></td><td></td><td>${f(sum(l,"prev_use"))}</td><td class="good">${f(sum(l,"noon_use"))}</td><td>${l.filter(r=>(checks.get(r.code)||{}).shared).length} / ${l.length}</td><td class="good">${f(sum(l,"prev_contract"))}</td><td class="good">${f(sum(l,"c1130"))}</td><td>${f(sum(l,"mapping"))}</td><td></td></tr>`;
  });

  $("#sheet").id==="sheet"&&($("#sheet").innerHTML=h);

async function loadDays(){
  const {data,error}=await sb.from("golden_days").select("*").order("day",{ascending:false}).limit(400);
  if(error)throw error;days=data;
}
async function loadDay(){
  rows=[];checks=new Map();
  if(day){
    const [a,b]=await Promise.all([sb.from("golden_daily").select("*").eq("day",day).order("ord").range(0,2999),sb.from("golden_checks").select("*").eq("day",day).range(0,2999)]);
    if(a.error)throw a.error;if(b.error)throw b.error;
    rows=a.data;b.data.forEach(x=>checks.set(x.code,x));
  }
}
async function init(){
  try{await loadDays();if(!day)day=days[0]?days[0].day:today();await loadDay();$("#notice").hidden=true}
  catch(e){$("#notice").hidden=false;$("#notice").textContent="서버에서 자료를 불러오지 못했습니다. 수퍼베이스에서 golden.sql 을 실행했는지 확인해 주세요.";rows=[]}
  loaded=true;render();
}
async function go(d){day=d;await loadDay().catch(()=>{rows=[]});render()}

/* ---- 엑셀 올리기 ---- */
const cl=s=>String(s??"").replace(/\s+/g,"").trim();
const num=v=>{if(v===""||v==null)return null;const n=Number(String(v).replace(/,/g,""));return isNaN(n)?null:n};
function toDay(v){
  if(typeof v==="number"&&v>30000){const d=new Date(Math.round((v-25569)*86400000));return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`}
  const m=String(v||"").match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);return m?`${m[1]}-${pad(+m[2])}-${pad(+m[3])}`:null;
}
function parseGolden(wb){
  const ws=wb.Sheets[wb.SheetNames.find(n=>cl(n).includes("골든룰"))||wb.SheetNames[0]];
  const a=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
  const hi=a.findIndex(r=>r.some(c=>cl(c)==="코드")&&r.some(c=>cl(c).includes("매니저")));
  if(hi<0)throw new Error("제목 줄(코드, 매니저 …)을 찾지 못했습니다.");
  const H=a[hi].map(cl),find=fn=>H.findIndex(fn);
  const col={day:find(x=>x==="일자"||x==="날짜"||x==="조회일"),branch:find(x=>x.includes("지점")),code:find(x=>x==="코드"),name:find(x=>x.includes("매니저")),grade:find(x=>x.includes("직책")),
    prev_use:find(x=>x.includes("전일")&&x.includes("사용")),noon_use:find(x=>x.includes("12시")),prev_contract:find(x=>x.includes("전일")&&x.includes("가계약")),c1130:find(x=>x.includes("11:30")),mapping:find(x=>x.includes("매핑")||x.includes("13:00"))};
  if(col.code<0||col.name<0||col.branch<0)throw new Error("지점명·코드·매니저 열이 필요합니다.");
  const out=[],ord={};
  a.slice(hi+1).forEach(r=>{
    const code=String(r[col.code]).trim();if(!code||!/\d/.test(code))return;
    if((col.grade>=0&&String(r[col.grade]).includes("센터장"))||!/\d/.test(String(r[col.branch])))return;   // 센터장·본부 줄은 제외
    const d=col.day>=0?toDay(r[col.day]):null;
    out.push({day:d,code,branch:String(r[col.branch]).trim(),name:String(r[col.name]).trim(),grade:col.grade>=0?String(r[col.grade]).trim():"",
      prev_use:col.prev_use>=0?num(r[col.prev_use]):null,noon_use:col.noon_use>=0?num(r[col.noon_use]):null,prev_contract:col.prev_contract>=0?num(r[col.prev_contract]):null,c1130:col.c1130>=0?num(r[col.c1130]):null,mapping:col.mapping>=0?num(r[col.mapping]):null});
  });
  return {rows:out,hasDay:col.day>=0};
}
async function upload(file){
  try{
    toast("엑셀을 읽는 중…");
    const wb=XLSX.read(await file.arrayBuffer(),{type:"array"});
    const {rows:rs,hasDay}=parseGolden(wb);
    if(!rs.length)throw new Error("올릴 자료가 없습니다.");
    const target=day||today();
    if(!hasDay||rs.some(r=>!r.day)){
      if(!confirm(`엑셀에 「일자」 열이 없어서 지금 조회일 ${target} 자료로 올립니다.\n계속할까요?`))return;
      rs.forEach(r=>{if(!r.day)r.day=target});
    }
    const byDay={};rs.forEach(r=>{(byDay[r.day]=byDay[r.day]||[]).push(r)});
    const ds=Object.keys(byDay).sort();
    if(!confirm(`${ds.length}일치 자료(${ds.join(", ")})를 올립니다.\n같은 날짜에 이미 올린 자료는 이 파일 내용으로 바꿉니다. (정보공유 체크와 비고는 유지됩니다)\n계속할까요?`))return;
    toast("저장 중…");
    for(const d of ds){
      let r=await sb.from("golden_daily").delete().eq("day",d);if(r.error)throw r.error;
      const list=byDay[d].map((x,i)=>({...x,day:d,ord:i}));
      for(let i=0;i<list.length;i+=500){r=await sb.from("golden_daily").insert(list.slice(i,i+500));if(r.error)throw r.error}
      r=await sb.from("golden_days").upsert({day:d,uploaded_by:me,uploaded_at:new Date().toISOString(),file_name:file.name,row_count:list.length});if(r.error)throw r.error;
    }
    day=ds[ds.length-1];toast("올렸습니다");await init();
  }catch(e){alert("올리지 못했습니다.\n"+(e&&e.message?e.message:"잠시 후 다시 시도해 주세요."))}
}
/* ---- 자료 종류별로 따로 올리기 (코드 기준으로 해당 칸만 갱신) ---- */
const TYPES={
  prev_contract:{label:"전일 가계약",cols:[{k:"prev_contract",pick:H=>{let i=H.findIndex(x=>x.includes("가계약")&&x.includes("건수"));return i>=0?i:H.findIndex(x=>x.includes("전일")&&x.includes("가계약"))}}]},
  c1130:{label:"당일 가계약(11:30)",cols:[{k:"c1130",pick:H=>{let i=H.findIndex(x=>x.includes("가계약")&&x.includes("건수"));return i>=0?i:H.findIndex(x=>x.includes("11:30"))}}]},
  mapping:{label:"매핑지사실적(13:00)",cols:[{k:"mapping",pick:H=>{let i=H.findIndex(x=>x.includes("매핑")&&x.endsWith("실적")&&!x.includes("인원"));return i>=0?i:H.findIndex(x=>x.includes("매핑")&&x.includes("실적")&&!x.includes("인원"))}}]},
  use:{label:"출근알리기",cols:[{k:"prev_use",pick:H=>H.findIndex(x=>x.includes("전일")&&x.includes("사용"))},{k:"noon_use",pick:H=>H.findIndex(x=>x.includes("12시"))}]}
};
let roster=null;
async function getRoster(){
  if(roster)return roster;roster=new Map();
  try{const {data}=await sb.from("coach_managers").select("code,name,branch,grade").range(0,999);(data||[]).forEach(r=>roster.set(r.code,r))}catch(e){}
  return roster;
}
function parsePartial(wb,type){
  const T=TYPES[type];
  const ws=wb.Sheets[wb.SheetNames[0]];
  const a=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
  let hi=a.findIndex(r=>r.some(c=>{const x=cl(c);return x==="코드"||x==="매니저코드"||x.includes("매니저코드")}));
  if(hi<0)throw new Error("제목 줄에서 「코드」(또는 「매니저코드」) 열을 찾지 못했습니다.\n찾은 제목: "+(a[0]||[]).map(cl).filter(Boolean).join(", "));
  // 제목이 두 줄(위: 묶음 이름, 아래: 세부 이름)인 자료도 읽기: 두 줄을 이어 붙여 하나의 제목으로 사용
  const r1=a[hi].map(cl),r2=(a[hi+1]||[]).map(cl);
  const two=r2.length&&r2.some(x=>x==="건수"||x==="실적"||x==="인원"||x.includes("보험료")||x.includes("환산"))&&!/^\d{5,}$/.test(r2[r1.findIndex(x=>x.includes("매니저코드"))]||"");
  const H=r1.map((x,j)=>{const y=two?(r2[j]||""):"";return x===y?x:x+y});
  if(two)hi=hi+1;
  const ci=H.findIndex(x=>x.includes("매니저코드"))>=0?H.findIndex(x=>x.includes("매니저코드")):H.findIndex(x=>x==="코드");
  const ni=H.findIndex(x=>x==="매니저"||x.includes("매니저명")),bi=H.findIndex(x=>x.includes("지점")),gi=H.findIndex(x=>x.includes("직책")),di=H.findIndex(x=>x==="일자"||x==="날짜"||x==="조회일");
  const cols=T.cols.map(c=>{let i=c.pick(H);if(i<0&&T.cols.length===1){ // 못 찾으면 이름에 핵심 단어가 들어간 열을 한 번 더 찾기
      const key=type==="prev_contract"||type==="c1130"?"가계약":type==="mapping"?"실적":"";i=key?H.findIndex((x,j)=>j!==ci&&x.includes(key)):-1}
    if(i<0)throw new Error(`「${T.label}」 값이 들어 있는 열을 찾지 못했습니다.\n찾은 제목: ${H.filter(Boolean).join(", ")}`);return {k:c.k,i,name:H[i]}});
  const by=new Map();let days=new Set();
  a.slice(hi+1).forEach(r=>{
    const code=String(r[ci]).trim();if(!code||!/\d/.test(code))return;
    const dd=di>=0?toDay(r[di]):null;if(dd)days.add(dd);
    {const gr=gi>=0?String(r[gi]):"",br=bi>=0?String(r[bi]):"";if(gr.includes("센터장")||(br&&!/\d/.test(br)))return}   // 센터장·본부 합계 줄은 제외
    const key=code;let o=by.get(key);if(!o){o={code,name:ni>=0?String(r[ni]).trim():"",branch:bi>=0?String(r[bi]).trim():"",grade:gi>=0?String(r[gi]).trim():"",day:dd,v:{}};by.set(key,o)}
    cols.forEach(c=>{const n=num(r[c.i]);if(n!=null)o.v[c.k]=(o.v[c.k]||0)+n});   // 같은 코드가 여러 줄이면 합산(건별 자료 대응)
  });
  return {list:[...by.values()],cols,days:[...days]};
}
async function uploadPartial(file,type){
  try{
    toast("엑셀을 읽는 중…");
    const wb=XLSX.read(await file.arrayBuffer(),{type:"array"});
    const {list,cols,days:ds}=parsePartial(wb,type);
    if(!list.length)throw new Error("올릴 자료가 없습니다.");
    const target=ds.length===1?ds[0]:(ds.length>1?null:(day||today()));
    if(target===null)throw new Error("한 파일에 여러 날짜가 섞여 있습니다. 날짜별로 나눠서 올려 주세요.");
    if(!confirm(`${TYPES[type].label} — ${target} 자료로 올립니다.\n읽은 열: ${cols.map(c=>"「"+c.name+"」").join(", ")}\n매니저(코드) ${list.length}명\n같은 코드가 여러 줄이면 합산합니다. 다른 칸(다른 종류 자료)은 그대로 유지됩니다.\n계속할까요?`))return;
    toast("저장 중…");
    const ro=await getRoster();
    const {data:ex,error:e0}=await sb.from("golden_daily").select("*").eq("day",target).range(0,2999);if(e0)throw e0;
    const have=new Map(ex.map(r=>[r.code,r]));
    let ord=ex.reduce((m,r)=>Math.max(m,r.ord||0),0);
    const out=list.map(o=>{
      let b=have.get(o.code);
      if(!b){const r=ro.get(o.code)||{};ord++;b={day:target,code:o.code,ord,branch:o.branch||r.branch||"",name:o.name||r.name||"",grade:o.grade||r.grade||"",prev_use:null,noon_use:null,prev_contract:null,c1130:null,mapping:null}}
      return {...b,...o.v};
    });
    for(let i=0;i<out.length;i+=500){const r=await sb.from("golden_daily").upsert(out.slice(i,i+500));if(r.error)throw r.error}
    const total=new Set([...have.keys(),...out.map(x=>x.code)]).size;
    const r2=await sb.from("golden_days").upsert({day:target,uploaded_by:me,uploaded_at:new Date().toISOString(),file_name:file.name,row_count:total});if(r2.error)throw r2.error;
    day=target;toast(`${TYPES[type].label} ${list.length}명을 올렸습니다`);await init();
  }catch(e){alert("올리지 못했습니다.\n"+(e&&e.message?e.message:"잠시 후 다시 시도해 주세요."))}
}
$("#upBtn").onclick=()=>$("#xf").click();
$("#xf").onchange=e=>{const fl=e.target.files[0];e.target.value="";if(!fl)return;const ty=$("#upType").value;ty==="all"?upload(fl):uploadPartial(fl,ty)};

(async()=>{
  render();
  if(!window.supabase){$("#notice").hidden=false;$("#notice").textContent="서버 연결 라이브러리를 불러오지 못했습니다.";return}
  sb=supabase.createClient(SUPA_URL,SUPA_KEY);
  const {data}=await sb.auth.getSession();
  if(!data.session){location.replace("index.html");return}
  me=NAME_BY_EMAIL[data.session.user.email]||data.session.user.email;
  await init();
  let t;sb.channel("golden-live").on("postgres_changes",{event:"*",schema:"public",table:"golden_checks"},()=>{clearTimeout(t);t=setTimeout(async()=>{const ae=document.activeElement;if(ae&&ae.classList&&ae.classList.contains("nt"))return;await loadDay().catch(()=>{});render()},500)}).subscribe();
})();
